<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">AgentMicro</title>
  <desc id="description">Six rounded task lights on a softly lit macOS app icon.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242424"/>
      <stop offset="1" stop-color="#0C0C0D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#background)" stroke="#3B3B3D" stroke-width="8" filter="url(#shadow)"/>
  <g stroke-width="4">
    <rect x="64" y="161" width="112" height="79" rx="20" fill="#9CD5FE" stroke="#D8ECFC"/>
    <rect x="200" y="161" width="112" height="79" rx="20" fill="#9BF396" stroke="#D3F9D0"/>
    <rect x="336" y="161" width="112" height="79" rx="20" fill="#FFD0B8" stroke="#F39A6D"/>
    <rect x="64" y="272" width="112" height="79" rx="20" fill="#FF7373" stroke="#FFAAAA"/>
    <rect x="200" y="272" width="112" height="79" rx="20" fill="#FFFFFF" stroke="#E1E6F0"/>
    <rect x="336" y="272" width="112" height="79" rx="20" fill="#9CD5FE" stroke="#D8ECFC"/>
  </g>
</svg>
